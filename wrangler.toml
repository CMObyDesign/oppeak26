name = "swot-engine"
main = "worker/src/index.js"
compatibility_date = "2024-01-01"

[vars]
# Non-sensitive defaults - safe to commit. Production can override these
# in Cloudflare Worker environment variables without code changes.
GHL_LOCATION_ID = "oLIENQCtGnt9U6gfLhE5"
BOOKING_LINK_47 = "https://my.cfobydesign.com/widget/booking/D3yNZNFtqIYsChkOgQc9"
BOOKING_LINK_297 = "https://my.cfobydesign.com/widget/booking/VGdN6KoFBtbdnSvHKHTh"
PAYMENT_LINK_47 = "https://my.cfobydesign.com/payment-link/6a0db7aa1a6dcdeebb53b641"
PAYMENT_LINK_297 = "https://my.cfobydesign.com/payment-link/6a0db7ceee2395af2c17f5d0"

# BETA COUPON BYPASS — HL payment links require a card even on 100%-off coupons,
# which blocks SOLOMON50 beta users. Setting these swaps the corresponding
# upgrade CTA on /report to skip payment and go direct to the survey.
# UNSET / REMOVE a line to restore payment for that tier.
#
# 2026-09-16: UPGRADE_297_URL removed — Full SWOT / Deep Dive must actually
# charge for the beta cohort. The $47→$297 upgrade CTA on the paid_47 report
# now points at PAYMENT_LINK_297 (real payment). $47 tier remains coupon-
# bypassed via UPGRADE_47_URL below.
UPGRADE_47_URL = "https://success.cfobydesign.com/mid-analysis"

# Interstitial sales page for the paid_47 → paid_297 upgrade CTA.
# The "Keep the momentum" button on the paid_47 report opens this URL instead
# of jumping straight to the payment link — an Elizabeth-copy Deep Dive sales
# page (7-person team, pre-call, 90-day plan) whose own CTA fires
# PAYMENT_LINK_297 → survey. To bypass the sales interstitial and send users
# straight to payment (previous behavior), comment this line out.
#
# 2026-09-22: Wired to deepdive.cfobydesign.com — a Cloudflare Pages custom
# domain aliased at the same oppeak26 Pages project that serves this file
# from app/public/deep-dive-sales/index.html. The pages.dev URL still works
# but the branded subdomain is what we promote in emails and ads.
DEEP_DIVE_SALES_URL = "https://deepdive.cfobydesign.com/deep-dive-sales/"

# Secrets (ANTHROPIC_API_KEY, GHL_API_KEY, CONSOLE_PASSWORD) are set in the
# Cloudflare dashboard under Settings > Variables and Secrets.

# R2 bindings — Solomon reference library (transcripts, testimonials,
# example analyses, rubric fragments) + soft-delete archive.
[[r2_buckets]]
binding = "SOLOMON_LIBRARY"
bucket_name = "solomonlibrary"

[[r2_buckets]]
binding = "SOLOMON_LIBRARY_ARCHIVE"
bucket_name = "solomon-library-archive"
